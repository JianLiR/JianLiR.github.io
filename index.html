<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #Navbar{
            background-color:#767522 ;
            width: 100vw;
            height: 100vh;
            position: relative;

            animation-name: NavagationBar;
            animation-direction: normal;
            animation-duration: 4s;

            display: flex;
            flex-direction: column;
        }
        @keyframes NavagationBar{
            25%{
                transform: translate(-25%vw);
            }
        }
        #container{
            display: flex;

        }
        #Popular{
            display: flex;
        }
    </style>
</head>
<body>
    <div id="Navbar">
        
        <a href="#" class="Home">Home</a>
        <a href="#" class="Dogs">Dogs</a>
        <a href="#" class="Cats">Cats</a>
        <a href="#" class="Birds">Birds</a>
        <a href="#" class="Fishes">Fishes</a>
        <a href="#" class="Snakes">Snakes</a>
        <a href="#" class="Small_Animals">Small Animals</a>
        <a href="#" class="Toys">Toys</a>
        <a href="#" class="Food">Food</a>

    </div>
    <div id="container">
     <div id="Popular">

     </div>
     </div>
</body>
</html>
