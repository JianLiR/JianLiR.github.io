<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #Navbar{
            background-color:#767522 ;
            width: -10vw;
            height: 10vh;
            display: flex;
            flex-direction: column;
            position: absolute;
            z-index: 2;
            border-radius: 15px;
            align-items: flex-start;
            padding-top: 15%;
        }
        #Nav_animation{
            background-color:#767522 ;
            width: 100vw;
            height: 100vh;
            position: absolute;
            animation-name: NavagationBar;
            animation-direction: normal;
            animation-duration: 2s;
            animation-timing-function: linear;
            animation-iteration-count: 1;
            animation-fill-mode: forwards;
            z-index: 1;
            border-radius: 15px;
        }
        @keyframes NavagationBar{
            0%{transform: translate(0%);}
            10%{transform: translate(-10%);}
            20%{transform: translate(-20%);}
            30%{transform: translate(-30%);}
            40%{transform: translate(-40%);}
            50%{transform: translate(-50%);}
            60%{transform: translate(-60%);}
            70%{transform: translate(-70%);}
            80%{transform: translate(-80%);}
            90%{transform: translate(-90%);}
            100%{transform: translate(-90%);}
        }
        #container{
            display: flex;

        }
        #Popular{
            display: flex;
        }
    </style>
</head>
<body>
    <div id="Nav_animation"></div>
    <div id="Navbar">
        
        <a href="#" class="Home">Home</a>
        <a href="#" class="Dogs">Dogs</a>
        <a href="#" class="Cats">Cats</a>
        <a href="#" class="Birds">Birds</a>
        <a href="#" class="Fishes">Fishes</a>
        <a href="#" class="Snakes">Snakes</a>
        <a href="#" class="Small_Animals">Small Animals</a>
        <a href="#" class="Toys">Toys</a>
        <a href="#" class="Food">Food</a>

    </div>
    <div id="container">
     <div id="Popular">

     </div>
     </div>
</body>
</html>
