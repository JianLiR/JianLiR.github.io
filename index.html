<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #Navbar{
            background-color:#A9E190 ;    
            display: flex;
            flex-direction: column;
            position: absolute;
            /*apparently moves it to the top*/
            z-index: 2;
            /*Makes the cornors rounded*/   
            border-radius: 15px;
            /* Adds a space to the top of the NavBar*/
            padding: 15px;
            top: 0;
            
        }
        #Nav_animation{
            background-color:#A9E190 ;
            width: 100vw;
            height: 100vh;
            position: absolute;
            animation-name: NavagationBar;
            animation-direction: normal;
            animation-duration: 1s;
            animation-timing-function: linear;
            animation-iteration-count: 1;
            animation-fill-mode: forwards;
            z-index: 1;
            top: 0;
            border-radius: 15px;
        }
        /*The animation that moves it from the right to the left */
        @keyframes NavagationBar{
            0%{transform: translate(0%);}
            10%{transform: translate(-10%);}
            20%{transform: translate(-20%);}
            30%{transform: translate(-30%);}
            40%{transform: translate(-40%);}
            50%{transform: translate(-50%);}
            60%{transform: translate(-60%);}
            70%{transform: translate(-70%);}
            80%{transform: translate(-80%);}
            90%{transform: translate(-90%);}
            100%{transform: translate(-90%);}
        }
        #container{
            display: flex;

        }
        #Popular{
            display: flex;
        }
    </style>
</head>
<body>
    <div id="Nav_animation"></div>
    <div id="Navbar">

        <a href=https://www.nicepng.com/png/full/8-85258_sold-out-sorry-sold-out-transparent.png class="Fishes">Fishes</a>
        <a href=https://www.nicepng.com/png/full/8-85258_sold-out-sorry-sold-out-transparent.png class="Snakes">Snakes</a>
        <a href=https://www.nicepng.com/png/full/8-85258_sold-out-sorry-sold-out-transparent.png class="Small_Animals">Small Animals</a>
        <a href="#" class="Toys">Toys</a>

    </div>
