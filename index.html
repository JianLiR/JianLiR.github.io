<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        #Navbar{
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            /*apparently moves it to the top*/
            z-index: 3;
            /*Makes the cornors rounded*/   
            border-radius: 15px;
            /* Adds a space to the top of the NavBar*/
            padding: 15px;
            top: 0;
            position: fixed;
        }
        /*whenever you hover over one of these tabs it will make it bigger*/
        .Home:hover{font-size: 2rem;}
        .Dogs:hover{font-size: 2rem;}
        .Cats:hover{font-size: 2rem;}
        .Fishes:hover{font-size: 2rem;}
        .Home:hover{font-size: 2rem;}
        .Birds:hover{font-size: 2rem;}
        .Snakes:hover{font-size: 2rem;}
        .Toys:hover{font-size: 2rem;}
        .Food:hover{font-size: 2rem;}

        #Nav_animation{
            background-color: #DBF4AD ;
            width: 100vw;
            height: 100vh;
            position: fixed;
            animation-name: NavagationBar;
            animation-direction: normal;
            animation-duration: 700ms;
            animation-timing-function: linear;
            animation-iteration-count: 1;
            animation-fill-mode: forwards;
            z-index: 2;
            top: 0;
            margin: 0;
            border-radius: 15px;
        }
        /*The animation that moves it from the right to the left */
        @keyframes NavagationBar{
            0%{transform: translate(0%);}
            10%{transform: translate(-10%);}
            20%{transform: translate(-20%);}
            30%{transform: translate(-30%);}
            40%{transform: translate(-40%);}
            50%{transform: translate(-50%);}
            60%{transform: translate(-60%);}
            70%{transform: translate(-70%);}
            80%{transform: translate(-80%);}
            90%{transform: translate(-90%);}
            100%{transform: translate(-90%);}
        }
        .Selling{
            display: flex;
            flex-wrap: nowrap;
        }
        /* This makes it so the space next behind the navbar isnt used so it is all centered on the visible part*/
        .space{
            width: 10%;
        }
        .dog{
            background-image: url(https://cdn.greenfieldpuppies.com/wp-content/uploads/2025/09/brown-and-white-dog-sitting-like-a-human-on-a-couch-next-to-a-window-and-leaning-a-front-leg-on-the-windowsill-800x800.jpeg) ;
            display: flex;
            background-position-x: 60%;
            background-position-y: 100%;
            width: 200px;
            height: 600px;
        }
        .cat{
            background-image: url(https://cdn.pixabay.com/photo/2023/12/08/05/38/cat-8436843_1280.jpg);
            background-position-x: 69%;
            background-position-y: 50%;
            width: 200px;
            height: 600px;
            margin: 0;
            padding: 0;

        }
        .logo{
            background-image: url(johnsrestaurant.png);
            background-repeat: no-repeat;
            opacity: 0.5;
            width: 200px;
            height: 600px;
            margin: 0;
            padding: 0;
            flex-grow: 2;
            
        }
        .fish{
            background-image: url(https://cdn.pixabay.com/photo/2016/06/21/18/14/aquarium-1471618_1280.jpg);
            background-position-x: 53%;
            background-position-y: center;  
            width: 200px;
            height: 600px;
            margin: 0;
            padding: 0;
        }
        .bird{
            background-image: url(https://cdn.pixabay.com/photo/2025/05/22/20/33/robin-9616505_1280.jpg);
            background-position-y: center;
            background-position-x: 32%;
            width: 200px;
            height: 600px;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
        <div id="Nav_animation"></div>
        <div id="Navbar">
            <a href=index.html class="Home">Home</a>
            <a href=Soldout.html class="Dogs">Dogs</a>
            <a href=Soldout.html class="Cats">Cats</a>
            <a href=Soldout.html class="Birds">Birds</a>
            <a href=Soldout.html class="Fishes">Fishes</a>
            <a href=Soldout.html class="Snakes">Snakes</a>      
            <a href="#" class="Toys">Toys</a>
            <a href="https://www.jollibeefoods.com/menu" class="Food">Food</a>  
        </div>
            <div class="Selling">
                <div class="space"></div>
                <div class="dog"></div>
                <div class="cat"></div>
                <div class="logo">
                    <img src="johnsrestaurant.png" alt="My logo">
                </div>
                <div class="fish"></div>
                <div class="bird"></div>
            </div>
            <div>
                <p>Hello</p>
                <div></div>
            </div>
</body>
</html>
