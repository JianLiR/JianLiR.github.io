<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .marquee {
  overflow: hidden;
  width: 300px;
}

.track {
  display: flex;
  width: max-content;
  animation: scroll 15s linear infinite;
}

.track img {
  height: 200px;
  margin-right: 16px; /* Use margin instead of flex gap for exact 50% math */
  object-fit: cover;
}

/* Optional: Pause when the user hovers */
.marquee:hover .track {
  animation-play-state: paused;
}

@keyframes scroll {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(-50%);
  }
}
  </style>
</head>
<body>
  <div class="marquee">
  <div class="track">
    <!-- Set 1: Your Pictures -->
     <div class="dog">
    <img src="https://cdn.pixabay.com/photo/2023/12/05/16/57/dog-8432098_1280.jpg" alt="Picture 1">
     </div>
    <img src="https://cdn.pixabay.com/photo/2025/03/26/12/14/kitten-9494429_1280.jpg" alt="Picture 2">
    <img src="https://cdn.pixabay.com/photo/2020/03/27/19/30/dwarf-rabbit-4974680_1280.jpg" alt="Picture 3">

    <!-- Set 2: Exact Duplicate for Seamless Loop -->
    <img src="https://cdn.pixabay.com/photo/2023/12/05/16/57/dog-8432098_1280.jpg" alt="" aria-hidden="true">
    <img src="https://cdn.pixabay.com/photo/2025/03/26/12/14/kitten-9494429_1280.jpg" alt="" aria-hidden="true">
    <img src="https://cdn.pixabay.com/photo/2020/03/27/19/30/dwarf-rabbit-4974680_1280.jpg" alt="" aria-hidden="true">
  </div>
</div>

</body>
</html>
